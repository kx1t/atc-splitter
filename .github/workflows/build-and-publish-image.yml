name: Build and Publish Multi-Arch Image

on:
  push:
    branches:
      - "**"
    paths:
      - Dockerfile
      - .dockerignore
      - rootfs/**
      - scripts/**
      - requirements*.txt
      - requirements/**
      - pyproject.toml
      - poetry.lock
      - Pipfile
      - Pipfile.lock
      - setup.py
      - setup.cfg
      - Makefile
      - app/**
      - .github/workflows/build-and-publish-image.yml
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to build (example: main or feature/foo)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: image-build-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kx1t/atc-splitter

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      ref_name: ${{ steps.vars.outputs.ref_name }}
      label: ${{ steps.vars.outputs.label }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Resolve target ref and tag
        id: vars
        shell: bash
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          ref_name="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ref_name="${INPUT_BRANCH}"
          fi

          ref_name="${ref_name#refs/heads/}"

          label="$(printf '%s' "${ref_name}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"

          if [[ -z "${label}" ]]; then
            echo "Unable to derive a valid label from branch '${ref_name}'" >&2
            exit 1
          fi

          if [[ "${label}" == "main" ]]; then
            tag="latest"
          else
            tag="${label}"
          fi

          echo "ref_name=${ref_name}" >> "${GITHUB_OUTPUT}"
          echo "label=${label}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build-arch:
    needs: resolve-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.ref_name }}

      - name: Resolve build metadata
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "git_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.resolve-target.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            APP_GIT_COMMIT=${{ steps.build_meta.outputs.git_commit }}
            APP_BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

  merge-manifest:
    runs-on: ubuntu-latest
    needs:
      - resolve-target
      - build-arch
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-target.outputs.tag }}"
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${tag}" \
            "${{ env.IMAGE }}:${tag}-amd64" \
            "${{ env.IMAGE }}:${tag}-arm64"

      - name: Inspect published manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.resolve-target.outputs.tag }}"
