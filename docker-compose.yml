services:
  atc-splitter:
    # To use pre-built image from GHCR:
    image: ghcr.io/kx1t/atc-splitter:latest
    # To build locally instead, comment the image line above and uncomment:
    # build: .
    container_name: atc-splitter
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Single volume for all persistent data (uploads, segments, Whisper model cache)
      - ./data:/app/data
    environment:
      PORT: "5000"
      GUNICORN_WORKERS: "4"
      # Set to "true" to enable per-segment speech recognition (Whisper tiny.en).
      # The Whisper model (~75 MB) is downloaded on first container start and
      # cached in ./data/models so subsequent starts do not re-download it.
      ENABLE_TRANSCRIPTION: "false"
      # WHISPER_MODEL_SIZE: "tiny.en"   # uncomment to override model size
