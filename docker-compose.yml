services:
  atc-splitter:
    # To use pre-built image from GHCR:
    image: ghcr.io/kx1t/atc-splitter:latest
    # To build locally instead, comment the image line above and uncomment:
    # build: .
    container_name: atc-splitter
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/segments:/app/segments
    environment:
      PORT: "5000"
      GUNICORN_WORKERS: "4"
